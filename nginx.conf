server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Reverse proxy for auth API if you want to use relative URLs
    # location /api/auth/ {
    #     proxy_pass http://auth-api:8081/api/auth/;
    # }

    # Optional: Reverse proxy for Python ML API
    # location /api/ml/ {
    #     proxy_pass http://ml-api:8000/;
    # }
}
