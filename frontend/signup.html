<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORO - Sign Up</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/auth-interactive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="auth-card">
        <h1 class="auth-title">ORO</h1>
        <p class="auth-subtitle">Create your account and start discovering</p>

        <div id="authBanner" class="auth-banner" aria-live="polite" style="display:none;"></div>

        <form id="signupForm" novalidate>
            <div class="auth-field">
                <label for="signupName">Full Name</label>
                <input id="signupName" name="name" type="text" placeholder="John Doe" required />
            </div>

            <div class="auth-field">
                <label for="signupEmail">Email</label>
                <input id="signupEmail" name="email" type="email" placeholder="you@example.com" required />
            </div>

            <div class="auth-field password-field">
                <label for="signupPassword">Password</label>
                <input id="signupPassword" name="password" type="password" placeholder="••••••••" required />
                <button type="button" class="password-toggle" data-target="signupPassword">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <div class="auth-field password-field">
                <label for="confirmPassword">Confirm Password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" placeholder="••••••••" required />
                <button type="button" class="password-toggle" data-target="confirmPassword">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <div class="password-strength" id="passwordStrength" style="display:none;">
                <div class="strength-bar">
                    <div class="strength-progress" id="strengthProgress"></div>
                </div>
                <span class="strength-text" id="strengthText">Password strength</span>
            </div>

            <div class="checkbox-row">
                <input type="checkbox" id="agreeTerms" required>
                <label for="agreeTerms">I agree to the <a href="#" style="color: var(--brand-primary);">Terms &
                        Conditions</a></label>
            </div>

            <div class="auth-actions">
                <button type="submit" class="auth-btn">Create Account</button>
            </div>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div style="display: flex; justify-content: center; margin-bottom: 20px; color-scheme: light;">
                <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"
                    data-text="sign_in_with" data-shape="rectangular"></div>
            </div>

            <div class="alt">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </form>
    </div>

    <script>
        window.AUTH_API_BASE = "";
        window.MAIN_PAGE = window.MAIN_PAGE || "index.html";

        window.handleCredentialResponse = async function (response) {
            const { credential } = response;
            console.log("Google token received:", credential);

            try {
                const res = await fetch(`${AUTH_API_BASE}/api/auth/google`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: credential }),
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem("auth_token", data.token);
                    localStorage.setItem("currentUser", JSON.stringify(data.user));
                    window.location.href = "index.html";
                } else {
                    console.error("Auth failed:", await res.text());
                    alert("Google sign-in failed. Please try again.");
                }
            } catch (error) {
                console.error("Google auth error:", error);
                alert("Connection error. Check backend.");
            }
        };
    </script>
    <div id="g_id_onload" data-client_id="349379703446-k4gnnssr1aesi091kbe84pr1omj3nl1j.apps.googleusercontent.com"
        data-callback="handleCredentialResponse" data-auto_prompt="false">
    </div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/auth.js?v=4"></script>
    <script src="js/auth-interactive.js?v=2"></script>
</body>

</html>
