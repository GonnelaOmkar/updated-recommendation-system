version: '3.8'

services:
  ml-api:
    build: 
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1

  auth-api:
    build:
      context: .
      dockerfile: Dockerfile.node
    ports:
      - "8081:8081"
    volumes:
      - sqlite_data:/app/data
    environment:
      - NODE_ENV=production

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ml-api
      - auth-api

volumes:
  sqlite_data:
